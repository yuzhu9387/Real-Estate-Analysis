<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlphaX — All You Need in Real Estate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0,0&display=swap');
:root{
  --primary:#004354;--primary-dark:#003541;--primary-soft:#e5f0f2;--primary-mid:#0b5d74;
  --surface:#f8fafb;--canvas:#f2f4f5;--white:#fff;--ink:#191c1d;--text:#3f484c;--muted:#70787d;
  --line:#d9e0e3;--line-soft:#e8edef;
  --green:#168362;--green-soft:#e2f6ee;--red:#c62828;--red-soft:#fdebea;
  --amber:#9a6700;--amber-soft:#fff4d6;--violet:#6957a5;--violet-soft:#f0ecfb;
  --gold:#b68235;
  --radius:12px;--shadow:0 1px 2px rgba(25,28,29,.05);--shadow-lift:0 10px 30px rgba(0,67,84,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid rgba(0,67,84,.45);outline-offset:2px}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;visibility:hidden}
body.icons-ready .material-symbols-outlined{visibility:visible}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(248,250,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,48px);height:62px}
.brand{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:0;text-align:left}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(0,67,84,.18)}
.brand-mark .material-symbols-outlined{font-size:22px}
.brand-name{font:800 17px/1.1 Manrope,Inter,sans-serif;color:var(--primary);display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand-slogan{font:600 12.5px/1.1 Inter,sans-serif;color:var(--text);letter-spacing:.01em}
@media(max-width:900px){.brand-slogan{display:none}}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:600;font-size:13px;transition:.15s}
.nav a .material-symbols-outlined{font-size:17px}
.nav a:hover{background:#eef1f2;color:var(--primary)}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.content{max-width:1340px;margin:auto;padding:34px clamp(16px,4vw,48px) 90px}
.footer{border-top:1px solid var(--line-soft);color:var(--muted);font-size:11px;padding:18px clamp(16px,4vw,48px) 26px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface)}

.eyebrow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin-bottom:8px}
.page-head{margin-bottom:26px}
.page-head h1{font:800 clamp(26px,3.4vw,38px)/1.15 Manrope,Inter,sans-serif;letter-spacing:-.025em;margin:0}
.page-sub{color:var(--text);margin:10px 0 0;max-width:840px;font-size:15px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-weight:700;font-size:12px;margin-bottom:14px}
.back .material-symbols-outlined{font-size:16px}
.section{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.section-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.section-head h2{font:700 18px/1.25 Manrope,Inter,sans-serif;margin:0}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px;flex-basis:100%}
.section-body{padding:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:700;letter-spacing:.05em}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.green{background:var(--green-soft);color:#0e6a4d}
.pill.amber{background:var(--amber-soft);color:#6e5000}

@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .rise-2{animation:rise .5s .08s cubic-bezier(.2,.8,.2,1) both}
  .rise-3{animation:rise .5s .16s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
}

/* ---------- home: hero ---------- */
.hero{text-align:center;padding:16px 0 6px}
.hero h1{font:800 clamp(30px,4.6vw,52px)/1.08 Manrope,Inter,sans-serif;letter-spacing:-.03em;margin:0}
.hero p{color:var(--text);font-size:16px;max-width:640px;margin:14px auto 0}
.hero .eyebrow{margin-bottom:12px}

/* ---------- home: umbrella ---------- */
.umbrella-wrap{padding:8px 10px 26px}
.umbrella-svg{display:block;width:min(980px,100%);margin:0 auto -6px;height:auto;overflow:visible}
.org-label{font:800 19px/1.1 Manrope,Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);text-align:center;margin:22px 0 6px}
.org-label small{display:block;letter-spacing:.02em;text-transform:none;color:var(--muted);font:600 11px/1.3 Inter,sans-serif;margin-top:5px}
.org-row{position:relative;display:grid;gap:14px;padding-top:22px;max-width:1200px;margin:auto}
.org-row::before{content:"";position:absolute;top:0;height:1px;background:var(--line)}
.org-heavy{grid-template-columns:repeat(3,1fr)}
.org-heavy::before{left:16.66%;right:16.66%}
.org-svc{grid-template-columns:repeat(4,1fr)}
.org-svc::before{left:12.5%;right:12.5%}
.org-svc .org-card::before{display:none}
.org-card{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:13px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:.18s;box-shadow:var(--shadow)}
.org-card::before{content:"";position:absolute;top:-22px;left:50%;width:1px;height:22px;background:var(--line)}
.org-card:hover,.org-card.active{border-color:var(--primary);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.org-card.heavy{border-top:4px solid var(--primary)}
.org-card.svc{border-top:4px solid #bcd2d8;padding:11px 12px}
.org-chip{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);font-weight:800}
.org-name{font:800 23px/1.1 Manrope,Inter,sans-serif;letter-spacing:-.015em;color:var(--primary-dark)}
.org-name.sm{font-size:15px;color:var(--ink)}
.org-card.svc .org-name{font-size:18px}
.org-tag{font-size:11px;line-height:1.35;color:var(--muted);font-weight:600}
.org-intro{display:block;font-size:11.5px;line-height:1.5;color:var(--text);margin-top:3px}
.card-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:11px}
.card-links a{border:1.5px solid var(--primary);border-radius:8px;padding:6px 11px;background:#fff;color:var(--primary);font-weight:800;font-size:10.5px;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:.15s}
.card-links a:hover{background:var(--primary);color:#fff}
.arc-dot{fill:#22d3ee}
.wf{display:block;margin-top:10px}
.wf .mm-label{color:var(--primary)}
.wf-chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.wf-chain span{font-size:9.5px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);border-radius:5px;padding:3px 7px;line-height:1.2}
.wf-chain i{font-style:normal;color:var(--muted);font-size:10px}
@media (prefers-reduced-motion:no-preference){
  .arc-dot{animation:dotGlow 2.4s ease-in-out infinite}
  @keyframes dotGlow{0%,100%{opacity:.35}50%{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.arc-pulse{display:none}}
.org-card.has-sub::after{content:"";position:absolute;bottom:-15px;left:50%;width:1px;height:15px;background:var(--line)}
.org-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1200px;margin:14px auto 0}
.org-subwrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:20px}
.org-subwrap::before{content:"";position:absolute;top:0;left:25%;right:25%;height:1px;background:var(--line)}
.org-card.sub{border-top:3px solid var(--primary-mid);padding:11px 13px}
.org-card.sub::before{content:"";position:absolute;top:-20px;left:50%;width:1px;height:20px;background:var(--line)}
.pf-row{display:flex;align-items:center;gap:5px;margin-top:5px}
.pf{width:12px;height:12px;border:1.5px solid var(--primary);border-radius:3px;flex:none;background:var(--primary-soft)}
.pf-note{font-size:10px;color:var(--muted);margin-left:5px}
.smap-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px;font-size:10px}
.smap-legend b{font:800 12.5px/1 Manrope,Inter,sans-serif;color:var(--ink);margin-right:4px}
.smap-legend .us-demo{border:1px solid #c96b6b;color:#b23b3b;background:#fdf0f0;border-radius:6px;padding:3px 8px;font-weight:800}
.smap-legend .ext-demo{border:1px solid var(--line);color:var(--text);background:var(--surface);border-radius:6px;padding:3px 8px;font-weight:600}
.smap{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.smap-stage{flex:1 1 180px;min-width:160px;border:1px dashed var(--line);border-radius:10px;background:#fff;padding:10px 11px}
.smap-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:8px}
.smap-head b{font-size:11.5px;line-height:1.25}
.smap-cash{font-size:9px;font-weight:800;padding:2.5px 7px;border-radius:4px;background:#f9e79b;color:#5c4a00;white-space:nowrap;flex:none}
.smap-arrow{align-self:center;color:var(--muted);font-size:14px;flex:none}
.smap-people{display:flex;flex-wrap:wrap;gap:4px}
.smap-people span{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:9.5px;font-weight:600;color:var(--text);background:var(--surface)}
.smap-people span.us{border-color:#c96b6b;color:#b23b3b;background:#fdf0f0;font-weight:800}
.cf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cf-col{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.cf-title{padding:9px 13px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.cf-col.in .cf-title{background:#e2f4ec;color:#0e6a4d}
.cf-col.out .cf-title{background:#faeeee;color:#9b4141}
.cf-body{padding:11px 13px}
.cf-group{margin-bottom:10px}
.cf-group:last-child{margin-bottom:0}
.cf-group b{display:block;font-size:11px;margin-bottom:3px}
.cf-group ul{margin:0;padding-left:16px}
.cf-group li{font-size:11px;color:var(--text);margin:2.5px 0;line-height:1.45}
.cf-note{margin-top:10px;font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:8px 11px;line-height:1.5}
.cf-note b{color:var(--ink)}
/* model sections — distinct colored heads, big left-aligned brand tags */
.section.model{border:1.5px solid var(--line);margin-bottom:28px}
.section-head.model-head{padding:20px 24px;border-bottom:1px solid var(--line)}
.model-head h2{font:800 24px/1.15 Manrope,Inter,sans-serif;letter-spacing:-.02em}
.model-head.m1{background:#e8f1f5}.model-head.m2{background:#e7f3ee}.model-head.m3{background:#eef0f7}
.model-head.m4{background:#f2edf8}.model-head.m5{background:#f8f0e0}
.mf-companies{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;margin-top:11px}
.mf-companies span{background:#fff;border:2px solid var(--primary);color:var(--primary-dark);font:800 15px/1 Manrope,Inter,sans-serif;padding:9px 16px;border-radius:10px}
/* fx money map — light tech canvas, animated in/out flows, icon stakeholders */
.fxmap{position:relative;border-radius:14px;padding:48px 20px 20px;margin-top:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(1100px 480px at 50% -10%,#f0f8fb,#e2edf2 72%)}
.fxmap::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(14,106,132,.14) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.fx-legend{position:absolute;top:14px;right:16px;display:flex;gap:13px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.fx-legend span{display:inline-flex;align-items:center;gap:5px}
.fx-legend span::before{content:"";width:8px;height:8px;border-radius:50%}
.fx-legend .li::before{background:#0e9f6e}.fx-legend .lo::before{background:#e8703a}.fx-legend .lu::before{background:#c96b6b}
.fx-grid{position:relative;display:grid;grid-template-columns:1fr 195px 1fr;column-gap:34px;align-items:center}
.fx-col{display:grid;gap:12px;align-content:center}
.fx-center{display:flex;align-items:center;justify-content:center}
.fx-node-main{width:100%;text-align:center;background:#fdf0f0;border:1.5px solid #d98c8c;border-radius:13px;padding:22px 12px;box-shadow:0 0 22px rgba(217,140,140,.35)}
.fx-node-main b{display:block;font:800 17px/1.25 Manrope,Inter,sans-serif;color:#b23b3b}
.fx-node-main small{display:block;margin-top:6px;font-size:9px;color:#b98080;font-weight:700;letter-spacing:.11em}
.fx-box{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow)}
.fx-col.left .fx-box::after{content:"";position:absolute;top:50%;right:-34px;width:34px;height:2px;background:repeating-linear-gradient(90deg,#0e9f6e 0 5px,transparent 5px 11px)}
.fx-col.right .fx-box::before{content:"";position:absolute;top:50%;left:-34px;width:34px;height:2px;background:repeating-linear-gradient(90deg,#e8703a 0 5px,transparent 5px 11px)}
.fx-bt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.fx-bt b{font-size:12.5px;color:var(--ink);line-height:1.25}
.fx-cash{font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:5px;white-space:nowrap;flex:none}
.fx-cash.in{background:#e2f4ec;color:#0e6a4d;border:1px solid rgba(14,159,110,.35)}
.fx-cash.out{background:#fdeee6;color:#b2542a;border:1px solid rgba(232,112,58,.35)}
.fx-cash.io{background:#fdf6d8;color:#8a6d00;border:1px solid rgba(212,160,23,.4)}
.fx-chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:7px 0}
.fx-node{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;max-width:100px;text-align:center}
.fx-node i{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);border:1px solid rgba(14,106,132,.28);color:var(--primary);font-size:15px}
.fx-node em{font-style:normal;font:700 8.5px/1.25 Inter,sans-serif;color:var(--text)}
.fx-node.us i{background:#fdf0f0;border-color:#dc9c9c;color:#c05252}
.fx-node.us em{color:#b23b3b}
.fx-arr{flex:none;width:22px;height:2px;position:relative}
.fx-arr::after{content:"";position:absolute;right:-1px;top:-2.5px;border-left:5px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.fx-arr.in{color:#0e9f6e;background:repeating-linear-gradient(90deg,#0e9f6e 0 4px,transparent 4px 9px)}
.fx-arr.out{color:#e8703a;background:repeating-linear-gradient(90deg,#e8703a 0 4px,transparent 4px 9px)}
.fx-arr.io{color:#d4a017;background:repeating-linear-gradient(90deg,#d4a017 0 4px,transparent 4px 9px)}
.fx-cap{font-size:9.5px;color:var(--muted);line-height:1.5;margin-top:7px;border-top:1px dashed rgba(14,106,132,.18);padding-top:7px}
@media (prefers-reduced-motion:no-preference){
  .fx-arr,.fx-col.left .fx-box::after,.fx-col.right .fx-box::before{animation:fxFlow .7s linear infinite}
  .fxmap.neutral .fx-col.right .fx-box::before{animation-name:fxFlowRev}
  .fx-node-main{animation:mainPulse 3s ease-in-out infinite}
  @keyframes fxFlow{to{background-position:11px 0}}
  @keyframes fxFlowRev{to{background-position:-11px 0}}
  @keyframes mainPulse{0%,100%{box-shadow:0 0 14px rgba(217,140,140,.28)}50%{box-shadow:0 0 30px rgba(217,140,140,.5)}}
}
@media(max-width:960px){
  .fx-grid{grid-template-columns:1fr;row-gap:12px}
  .fx-center{order:-1}
  .fx-node-main{max-width:340px}
  .fx-col.left .fx-box::after,.fx-col.right .fx-box::before{display:none}
  .fxmap.neutral .fx-col.left .fx-box::before,.fxmap.neutral .fx-col.right .fx-box::after{display:none}
}
@media(max-width:720px){.cf-cols{grid-template-columns:1fr}.smap-arrow{display:none}}
/* asset management page */
.mini-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.am-layers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.am-layer{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px}
.am-layer::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:12px;box-shadow:var(--shadow);z-index:1}
.am-layer:last-child::after{display:none}
.am-layer small{display:inline-block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);font-weight:800;margin-bottom:7px}
.am-layer h3{margin:0 0 6px;font:800 17px/1.15 Manrope,Inter,sans-serif}
.am-layer p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.am-layer ul{margin:9px 0 0 16px;padding:0;font-size:11.5px;line-height:1.65;color:var(--text)}
.am-life{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.am-step{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.am-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;margin-bottom:9px}
.am-step strong{display:block;font-size:13px;margin-bottom:6px}
.am-step p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
.am-plays{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.am-play{border:1px solid var(--line);border-radius:13px;padding:17px;background:#fff;box-shadow:var(--shadow)}
.am-play-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}
.am-play h3{margin:0;font:800 22px/1.1 Manrope,Inter,sans-serif;letter-spacing:-.02em;color:var(--primary-dark)}
.am-co{flex:none;border:1.5px solid #c96b6b;color:#b23b3b;background:#fdf0f0;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:800}
.am-desc{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.am-kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kpi{border:1px solid rgba(14,106,132,.35);color:var(--primary);border-radius:999px;padding:6px 10px;font-size:10.5px;font-weight:800;background:#fff}
.am-vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.am-vs-col{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.am-vs-head{padding:12px 16px;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.am-vs-head.asset{background:var(--primary-soft);color:var(--primary-dark)}
.am-vs-head.proj{background:#f3f5f7;color:var(--muted)}
.am-vs-body{padding:14px 16px;display:grid;gap:11px}
.am-field b{display:block;font-size:12.5px;margin-bottom:3px}
.am-field small{display:block;color:var(--muted);font-size:11px;line-height:1.55}
.am-triads{display:grid;gap:10px}
.am-triad{display:grid;grid-template-columns:110px repeat(3,1fr);gap:10px}
.am-thead{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--surface);font-weight:800;font-size:12.5px}

.feeds-in{display:flex;align-items:center;gap:0}
.feeds-list{display:grid;gap:6px;flex:none}
.feed{display:flex;align-items:center;gap:0}
.feed em{font-style:normal;border:1px solid rgba(14,156,184,.4);background:#fff;color:var(--primary-dark);border-radius:6px;padding:4px 8px;font-size:9px;font-weight:800;white-space:nowrap}
.f-line{width:22px;height:2px;background:repeating-linear-gradient(90deg,#0e9cb8 0 5px,transparent 5px 10px);position:relative;flex:none}
.f-line::after{content:"";position:absolute;right:-1px;top:-2.5px;border-left:5px solid #0e9cb8;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.feeds-in .ain{flex:1;min-width:0}
.v-link{position:relative;width:2px;height:20px;margin:2px auto;background:repeating-linear-gradient(180deg,#0e9cb8 0 5px,transparent 5px 10px)}
.v-link::after{content:"";position:absolute;left:-3px;bottom:-1px;border-top:6px solid #0e9cb8;border-left:4px solid transparent;border-right:4px solid transparent}
.v-lab{font-size:8.5px;color:var(--muted);text-align:center;font-weight:700}
.ai-link{position:relative;height:2px;width:100%;background:repeating-linear-gradient(90deg,#0e9cb8 0 6px,transparent 6px 13px)}
.ai-link::after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid #0e9cb8;border-top:4px solid transparent;border-bottom:4px solid transparent}
@media (prefers-reduced-motion:no-preference){
  .ai-link,.f-line{animation:fxFlow .55s linear infinite}
  .v-link{animation:vFlow .55s linear infinite}
  @keyframes vFlow{to{background-position:0 10px}}
  .ai-scan{animation:aiScan 5.5s linear infinite}
  @keyframes aiScan{0%{top:-90px}100%{top:110%}}
  .ain.human{animation:hGlowL 3s ease-in-out infinite}
  @keyframes hGlowL{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 14px rgba(217,140,140,.5)}}
}
/* ---------- software systems — light schematic board ---------- */
.sws{--mono:ui-monospace,SFMono-Regular,Menlo,"SF Mono",monospace;
  --wire:#8ba0a8;--mut:#6b7c83;
  position:relative;margin-top:26px;border:1px solid #ccd8dc;border-radius:14px;overflow:hidden;
  background:#f7f9fa;color:#33474e}
.sws::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,67,84,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,67,84,.05) 1px,transparent 1px);
  background-size:20px 20px}
.sws>*{position:relative;z-index:1}
.sws-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid #dbe3e6;background:#fff}
.sws-badge{font:800 9px/1 var(--mono);letter-spacing:.18em;color:#fff;background:var(--primary);border-radius:4px;padding:6px 9px;flex:none}
.sws-h1{margin:0;font:800 15px/1.25 Manrope,Inter,sans-serif;color:var(--ink)}
.sws-h1 span{display:block;margin-top:4px;font:600 10px/1.5 var(--mono);letter-spacing:.04em;color:var(--mut)}
.sws-legend{margin-left:auto;display:flex;gap:15px;flex-wrap:wrap}
.sws-legend i{font-style:normal;display:flex;align-items:center;gap:7px;font:700 9px/1 var(--mono);letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.sws-key{width:9px;height:9px;border-radius:2px;flex:none;border:1.5px solid currentColor;background:#fff}
.sws-key.d{color:#4a72a8}.sws-key.a{color:#0b5d74}.sws-key.g{color:#b5891f}.sws-key.h{color:#c05252}
/* rails */
.sws-rail{padding:20px 18px 18px;display:grid;align-items:center;gap:0;
  grid-template-columns:minmax(0,1.2fr) 28px minmax(0,.82fr) 28px minmax(0,1.02fr) 28px minmax(0,.9fr)}
.sws-rail2{padding:14px 18px 20px;display:grid;align-items:center;gap:0;
  grid-template-columns:minmax(0,168px) 28px minmax(0,1fr) 28px minmax(0,168px) 28px minmax(0,1fr)}
.sws-col{min-width:0;display:grid;gap:10px;align-content:center}
.sws-cap{font:800 9px/1 var(--mono);letter-spacing:.15em;color:#7d8d94;display:flex;align-items:center;gap:8px}
.sws-cap::after{content:"";flex:1;height:1px;background:#dde5e8}
.sws-grp{border:1px dashed #c6d3d8;border-radius:11px;background:rgba(255,255,255,.6);padding:10px;display:grid;gap:10px}
/* nodes */
.sws-node{--c:#0b5d74;--cbg:#e8f2f5;position:relative;border:1px solid #d3dde1;border-left:3px solid var(--c);
  border-radius:8px;background:#fff;padding:11px 12px;box-shadow:0 1px 2px rgba(25,28,29,.05);transition:.16s}
.sws-node.data{--c:#4a72a8;--cbg:#eaf0f9}
.sws-node.hum{--c:#c05252;--cbg:#fbeeee}
.sws-node:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,67,84,.13)}
.sws-nh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sws-nh b{flex:1;min-width:0;font:800 12px/1.3 Manrope,Inter,sans-serif;color:var(--ink);overflow-wrap:anywhere}
.sws-nh .bot{width:28px;height:25px}
.sws-nh .hum-b{width:26px;height:26px;background:#fbeeee;border-color:#d98c8c}
.sws-nh .hum-b .p-ic{width:13px;height:13px;fill:#c05252}
.sws-ic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--cbg);color:var(--c);flex:none}
.sws-ic .material-symbols-outlined{font-size:16px}
.sws-tag{font:800 7.5px/1 var(--mono);letter-spacing:.1em;padding:4px 6px;border-radius:3px;flex:none;
  color:var(--c);background:var(--cbg);border:1px solid currentColor}
.sws-in{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.sws-in em{font-style:normal;border:1px solid #c9d6e6;background:#f2f6fc;color:#3c5a86;border-radius:5px;
  padding:4px 8px;font:800 9px/1 var(--mono)}
.sws-sub{display:grid;gap:5px;margin-bottom:9px}
.sws-sub span{display:flex;align-items:center;gap:7px;border:1px solid #dbe4e7;border-radius:6px;background:#f7fafb;
  padding:6px 8px;font:700 10px/1.25 Inter,sans-serif;color:#2c3f46}
.sws-sub span::before{content:"";width:5px;height:5px;border-radius:50%;background:#0b5d74;flex:none}
.sws-use{margin:0;font-size:10px;line-height:1.6;color:var(--mut)}
.sws-hu{margin-top:9px;border-top:1px dashed #dde5e8;padding-top:8px;display:flex;gap:7px;align-items:flex-start;
  font-size:9.5px;line-height:1.55;color:#4a5b62}
.sws-hu .p-ic{width:12px;height:12px;fill:#c05252;flex:none;margin-top:1px}
/* wires — solid engineering lines, flush to both cards */
.sws-ar{position:relative;align-self:center;height:1.5px;background:var(--wire);width:calc(100% + 6px);margin-left:-3px}
.sws-ar::after{content:"";position:absolute;right:-2px;top:-3.5px;border-left:7px solid var(--wire);
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.sws-hline{position:relative;width:26px;height:1.5px;background:var(--wire);flex:none}
.sws-hline::after{content:"";position:absolute;right:-2px;top:-3.5px;border-left:7px solid var(--wire);
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.sws-vline{position:relative;width:1.5px;height:20px;background:var(--wire)}
.sws-vline::after{content:"";position:absolute;left:-3.5px;bottom:-2px;border-top:7px solid var(--wire);
  border-left:4px solid transparent;border-right:4px solid transparent}
/* decision gates */
.sws-gate{display:grid;justify-items:center}
.sws-dia{width:112px;height:112px;transform:rotate(45deg);border:1.5px solid #d8b25f;border-radius:10px;
  background:#fff8e6;display:grid;place-items:center;box-shadow:0 2px 10px rgba(154,103,0,.1)}
.sws-dia b{transform:rotate(-45deg);width:100px;text-align:center;font:800 12px/1.3 Manrope,Inter,sans-serif;color:#7a5300}
/* branch labels — one style everywhere */
.sws-lab{font-style:normal;font:800 8.5px/1 var(--mono);letter-spacing:.12em;color:var(--mut);
  border:1px solid #d3dde1;background:#fff;border-radius:4px;padding:4px 6px;flex:none}
.sws-lab.yes{color:#0b5d74;border-color:#a9cdd6;background:#eef7f9}
.sws-ar .sws-lab{position:absolute;left:50%;top:-24px;transform:translateX(-50%)}
.sws-vbr{display:grid;justify-items:center;gap:6px;margin-top:12px}
.sws-outrow{display:flex;align-items:center;gap:8px}
.sws-outrow .sws-node{flex:1;min-width:0}
.sws-forkwrap{position:relative;display:grid;gap:10px}
.sws-spine{position:absolute;left:-15px;width:1.5px;background:var(--wire)}
.sws-forkwrap .sws-lab{position:relative}
.sws-forkwrap .sws-lab::before{content:"";position:absolute;top:50%;right:100%;width:15px;height:1.5px;
  background:var(--wire);transform:translateY(-50%)}
.sws-vbr::before{content:"";width:1.5px;height:14px;background:var(--wire);justify-self:center}
.sws-end{border:1px solid #cfd9dd;border-radius:7px;background:#fff;padding:9px 13px;font:800 10px/1.3 var(--mono);
  letter-spacing:.08em;color:var(--mut);white-space:nowrap}
.sws-end.go{border-color:#0b5d74;color:#0b5d74;background:#eef7f9}
/* human-involved divider */
.sws-div{display:flex;align-items:center;gap:12px;padding:4px 18px 0}
.sws-div i{font-style:normal;display:flex;align-items:center;gap:7px;font:800 9px/1 var(--mono);letter-spacing:.16em;color:#c05252}
.sws-div i .p-ic{width:12px;height:12px;fill:#c05252}
.sws-div span{flex:1;height:1px;background:#e6cfcf}
@media(max-width:1020px){
  .sws-rail,.sws-rail2{grid-template-columns:1fr;row-gap:14px}
  .sws-ar{width:1.5px;height:26px;justify-self:center;margin:0}
  .sws-ar::after{right:auto;left:-3.5px;top:auto;bottom:-2px;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:7px solid var(--wire);border-bottom:none}
  .sws-ar .sws-lab{left:auto;right:-8px;top:50%;transform:translate(100%,-50%)}
  .sws-outrow{flex-wrap:wrap}
}
/* ---------- construction — old function tree ---------- */
.cold{display:grid;gap:9px}
.cold-root{justify-self:start;border:1.5px solid #c4c9cd;border-radius:8px;background:#fff;padding:7px 13px;
  font:800 11.5px/1 Manrope,Inter,sans-serif;color:#4d585e}
.cold-fan{position:relative;height:14px;margin-left:36px}
.cold-fan::before{content:"";position:absolute;left:0;top:0;bottom:7px;width:1.5px;background:#c4c9cd}
.cold-fan::after{content:"";position:absolute;left:0;right:6px;bottom:7px;height:1.5px;background:#c4c9cd}
.cold-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:8px}
.cold-c{border:1px solid #dcdfe2;border-radius:9px;background:#fff;padding:9px 10px}
.cold-c>b{display:block;font:800 11px/1.2 Manrope,Inter,sans-serif;color:#4d585e;margin-bottom:7px;
  padding-bottom:6px;border-bottom:1px solid #edf0f1}
.cold-c ol{margin:0;padding-left:15px;display:grid;gap:3px}
.cold-c li{font-size:9.5px;line-height:1.45;color:#5c666c}
.cold-loose{display:flex;align-items:center;gap:9px;border:1.5px dashed #c8cdd1;border-radius:9px;background:#fff;
  padding:8px 11px;margin-top:2px}
.cold-loose b{font:800 11px/1 Manrope,Inter,sans-serif;color:#4d585e;flex:none}
.cold-loose span{font-size:9.5px;color:#8b959a}
/* ---------- construction — new four-domain architecture ---------- */
.cnew{display:grid;grid-template-columns:minmax(0,.9fr) 124px minmax(0,1.22fr);align-items:center;row-gap:10px}
.cn-col{display:grid;justify-items:stretch;min-width:0}
.dom{border:1.5px solid rgba(105,87,165,.4);border-radius:12px;background:rgba(240,236,251,.55);padding:11px 12px}
.dom-t{display:flex;align-items:center;gap:7px;font:800 9px/1 Inter,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:#6957a5;margin-bottom:9px}
.dom-t::after{content:"";flex:1;height:1px;background:rgba(105,87,165,.25)}
.dbn{display:flex;align-items:center;gap:9px;border:1.5px solid rgba(22,131,98,.45);border-radius:10px;
  background:#eefaf4;padding:8px 10px;box-shadow:var(--shadow)}
.dbn .material-symbols-outlined{font-size:19px;color:#0e6a4d;flex:none}
.dbn div{min-width:0}
.dbn b{display:block;font:800 11px/1.25 Manrope,Inter,sans-serif;color:#0d5a43}
.dbn small{display:block;font-size:8.5px;line-height:1.45;color:#3f7d68;margin-top:2px}
.cn-steps{margin:9px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.cn-steps li{display:flex;align-items:center;gap:7px;border:1px solid var(--line-soft);border-radius:7px;
  background:#fff;padding:5px 8px;font-size:9.5px;font-weight:600;color:var(--text)}
.cn-steps li::before{content:counter(cns);counter-increment:cns;font:800 8px/1 Inter,sans-serif;color:#9aa4aa;flex:none;width:9px}
.cn-steps{counter-reset:cns}
.cn-steps li.hum{border-color:#d98c8c;background:#fdf7f7;color:#a34040}
.cn-steps li .p-ic{width:11px;height:11px;fill:#c05252;flex:none;margin-left:auto}
.cn-note{border:1.5px solid #e2c886;border-radius:10px;background:#fff8e6;padding:10px 11px}
.cn-note b{display:block;font:800 10.5px/1.2 Manrope,Inter,sans-serif;color:#7a5300;margin-bottom:6px}
.cn-note ol{margin:0;padding-left:15px;display:grid;gap:3px}
.cn-note li{font-size:9.5px;line-height:1.5;color:#6e5000}
.cn-care{display:flex;align-items:center;gap:8px;border:1.5px solid #d8b25f;border-radius:9px;background:#fff3d6;
  padding:7px 10px;font:800 10.5px/1 Manrope,Inter,sans-serif;color:#7a5300;flex:none}
.cn-care .p-ic{width:13px;height:13px;fill:#9a6700}
.cn-cust{display:grid;justify-items:stretch}
.cn-cust .dbn{min-width:0}
.cn-c{align-self:stretch}
.cn-c>.dom{height:100%;display:flex;flex-direction:column}
.cn-c .cn-lanes{flex:1;align-content:center}
.cn-c .cn-lanes.spread{align-content:space-between}
.cold-c.plain>ol{padding-left:16px}
.cn-foot{margin-top:10px;border-top:1px dashed rgba(105,87,165,.3);padding-top:9px;font-size:9.5px;
  line-height:1.6;color:var(--muted)}
.cn-foot b{color:var(--primary)}
.cn-qa{margin:8px 0 0;font-size:9px;line-height:1.5;color:var(--primary);font-weight:700}
.cn-lanes{display:grid;gap:8px;margin-top:9px}
.cn-lane{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;box-shadow:var(--shadow)}
.cn-lane>b{display:flex;align-items:center;gap:7px;font:800 11px/1 Manrope,Inter,sans-serif;color:var(--ink);
  margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.cn-lane .material-symbols-outlined{font-size:15px;color:var(--primary)}
.cn-lane ol{margin:0;padding-left:16px;display:grid;gap:3px}
.cn-lane li{font-size:9px;line-height:1.45;color:var(--text)}
/* connectors */
.cn-ar{position:relative;align-self:center;height:2px;width:calc(100% + 6px);margin-left:-3px;
  background:repeating-linear-gradient(90deg,#0e9cb8 0 6px,transparent 6px 13px)}
.cn-ar::after{content:"";position:absolute;right:-2px;top:-3px;border-left:6px solid #0e9cb8;
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.cn-ar i{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:126px;text-align:center;
  font:800 8.5px/1.35 Inter,sans-serif;font-style:normal;color:var(--primary)}
.cn-up{position:relative;width:2px;height:26px;justify-self:center;margin:7px 0;
  background:repeating-linear-gradient(180deg,#0e9cb8 0 5px,transparent 5px 10px)}
.cn-up::after{content:"";position:absolute;left:-3px;top:-2px;border-bottom:6px solid #0e9cb8;
  border-left:4px solid transparent;border-right:4px solid transparent}
.cn-up i{position:absolute;left:11px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font:800 8.5px/1 Inter,sans-serif;font-style:normal;color:var(--primary)}
.cn-bi{display:flex;align-items:center;gap:9px;margin-top:9px}
.cn-bi span{flex:1;height:2px;background:repeating-linear-gradient(90deg,#0e9cb8 0 5px,transparent 5px 11px)}
.cn-bi i{font-style:normal;font:800 8.5px/1 Inter,sans-serif;letter-spacing:.04em;color:var(--primary);white-space:nowrap}
.cold-c ul{margin:0;padding-left:14px;display:grid;gap:3px}
.cold-c ul li{font-size:9.5px;line-height:1.45;color:#5c666c}
.cold-none{margin:0;font-size:9.5px;color:#a0a9ae;font-style:italic}
	.cn-feed{margin:9px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.cn-feed li{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:7px;
  background:#fff;padding:5px 8px;font-size:9.5px;font-weight:600;color:var(--text)}
.cn-feed li::before{content:"";width:5px;height:5px;border-radius:50%;background:#168362;flex:none}
.cn-lane>b em{flex-basis:100%;font-style:normal;font:700 8px/1 Inter,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:#0e6a4d;margin-top:5px}
.cn-lane>b{flex-wrap:wrap;align-items:center}
.cn-lane ul{margin:0;padding-left:14px;display:grid;gap:3px}
.cn-lane ul li{font-size:9px;line-height:1.5;color:var(--text)}
.cn-note.ai{border-color:rgba(14,156,184,.45);background:#eef8fb;margin-top:9px}
.cn-note.ai b{color:var(--primary)}
.cn-note.ai li{color:#28616f}
.cn-dn{position:relative;width:2px;height:26px;justify-self:center;margin:7px 0;
  background:repeating-linear-gradient(180deg,#0e9cb8 0 5px,transparent 5px 10px)}
.cn-dn::after{content:"";position:absolute;left:-3px;bottom:-2px;border-top:6px solid #0e9cb8;
  border-left:4px solid transparent;border-right:4px solid transparent}
.cn-dn i{position:absolute;left:11px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font:800 8.5px/1 Inter,sans-serif;font-style:normal;color:var(--primary)}
.cn-a{grid-column:1;grid-row:1}
.cn-b{grid-column:2;grid-row:1}
.cn-c{grid-column:3;grid-row:1/4}
.cn-d{grid-column:1;grid-row:2}
.cn-e{grid-column:1;grid-row:3}
.cn-f{grid-column:2;grid-row:3}
.cn-g{grid-column:2;grid-row:2}
.cn-h{grid-column:3;grid-row:1}
.cn-i{grid-column:3;grid-row:2}
.cn-j{grid-column:3;grid-row:3}
@media (prefers-reduced-motion:no-preference){
  .cn-ar,.cn-bi span{animation:fxFlow .55s linear infinite}
  .cn-up{animation:vFlow .55s linear infinite}
}
@media(max-width:1020px){
  .cnew{grid-template-columns:1fr}
  .cnew>*{grid-column:auto;grid-row:auto}
  .cn-a{order:1}.cn-b{order:2}.cn-h{order:3}.cn-d{order:4}.cn-g{order:5}.cn-i{order:6}
  .cn-e{order:7}.cn-f{order:8}.cn-j{order:9}.cn-c{order:10}
  .cn-ar{display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:auto;margin:0;
    border:1px dashed rgba(14,156,184,.5);border-radius:9px;background:rgba(255,255,255,.65);padding:7px 11px;
    background-image:none;animation:none}
  .cn-ar::after{content:"↓";position:static;border:0;color:#0e9cb8;font:800 12px/1 Inter,sans-serif}
  .cn-ar i{position:static;transform:none;width:auto;white-space:nowrap;text-align:left}
  .cn-lanes{grid-template-columns:1fr}
}
/* ---------- TC & Loan — agent tracks with human gates ---------- */
.tl{display:grid;justify-items:stretch}
.dom.ai{border-color:rgba(14,156,184,.4);background:rgba(234,247,250,.6)}
.dom-t.ai{color:var(--primary)}
.dom-t.ai::after{background:rgba(14,156,184,.25)}
.dom.hum{border-color:rgba(217,140,140,.55);background:rgba(253,244,244,.6)}
.dom-t.hum{color:#a34040;display:flex;align-items:center;gap:7px}
.dom-t.hum .p-ic{width:12px;height:12px;fill:#c05252}
.dom-t.hum::after{background:rgba(217,140,140,.3)}
.tl-caps{display:grid;gap:8px}
.tl-tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl-lane>b{align-items:flex-start;flex-wrap:wrap}
.tl-lane>b em{flex-basis:100%;font-style:normal;font:700 8px/1 Inter,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--primary);margin-top:5px}
.tl-steps{counter-reset:tls;margin:0;padding:0;list-style:none;display:grid;gap:4px}
.tl-steps li{display:flex;align-items:center;gap:7px;border:1px solid var(--line-soft);border-radius:7px;

.tl-dn,.tl-up{position:relative;width:2px;height:26px;justify-self:center;margin:9px 0;
  background:repeating-linear-gradient(180deg,#0e9cb8 0 5px,transparent 5px 10px)}
.tl-dn::after{content:"";position:absolute;left:-3px;bottom:-2px;border-top:6px solid #0e9cb8;

  border-left:4px solid transparent;border-right:4px solid transparent}

  font:800 8.5px/1 Inter,sans-serif;font-style:normal;color:var(--primary)}

@media (prefers-reduced-motion:no-preference){.tl-dn,.tl-up{animation:vFlow .55s linear infinite}}
@media(max-width:1020px){

  .pint-link.l::after{content:"↓";position:static;border:0;color:#7d8d94;font:800 12px/1 Inter,sans-serif}
  .pint-link.r::after{content:"↑";position:static;border:0;color:#7d8d94;font:800 12px/1 Inter,sans-serif}
  .pint-link.bi::after{content:"⇅";position:static;border:0;color:#7d8d94;font:800 12px/1 Inter,sans-serif}

.mm{display:block;margin-top:10px;border-top:1px dashed var(--line-soft);padding-top:9px;font-size:11.5px;color:var(--ink);font-weight:600}
.mm-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:800;color:var(--gold);margin-bottom:4px}
.svc-money{display:block;margin-top:7px;border-top:1px dashed var(--line-soft);padding-top:6px;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0e6a4d}
.org-detail{max-width:1200px;margin:14px auto 0;border-left:3px solid var(--primary);background:#f6f8f8;border-radius:8px;padding:15px 17px;display:grid;grid-template-columns:1.3fr 1fr auto;gap:18px;align-items:center}
.org-detail h3{margin:0 0 4px;font:700 15px/1.2 Manrope,Inter,sans-serif}
.org-detail p{margin:0;color:var(--text);font-size:12px}
.org-detail .label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);margin-bottom:5px}
.org-detail a{color:var(--primary);font-weight:700;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* ---------- home: four angles ---------- */
.angles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.angle-card{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--white);padding:22px 20px 18px;text-align:left;transition:.2s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:0;min-height:230px;text-decoration:none;color:var(--ink);overflow:hidden}
.angle-card::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--primary);opacity:0;transition:.2s}
.angle-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lift);transform:translateY(-3px)}
.angle-card:hover::after{opacity:1}
.angle-num{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--gold)}
.angle-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:11px;background:var(--primary-soft);color:var(--primary);margin:14px 0 12px}
.angle-icon .material-symbols-outlined{font-size:24px}
.angle-card h3{font:800 22px/1.1 Manrope,Inter,sans-serif;margin:0 0 8px;letter-spacing:-.01em}
.angle-card p{margin:0;color:var(--text);font-size:12.5px;line-height:1.5}
.angle-sys{margin-top:auto;padding-top:14px;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--primary);display:flex;align-items:center;gap:6px}
.angle-go{position:absolute;right:14px;bottom:12px;color:#b5bec1;transition:.2s}
.angle-card:hover .angle-go{color:var(--primary);transform:translateX(3px)}

/* ---------- money page ---------- */
.mf-chips{display:flex;gap:7px;flex-wrap:wrap}
.mf-chips a{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:700;text-decoration:none}
.mf-chips a:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.flow{display:block;width:100%;height:auto;overflow:visible}
.flow text{font-family:Inter,sans-serif;font-size:16.5px;fill:var(--ink);font-weight:600}
.flow .fl-sub{font-size:13px;fill:var(--muted);font-weight:500}
.flow .fl-big{font-size:19px;font-weight:700}
.flow .fl-box{fill:#fff;stroke:var(--line);stroke-width:1.5;rx:10}
.flow .fl-box-hi{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2;rx:12}
.flow .fl-in{stroke:var(--green);stroke-width:2.5;fill:none}
.flow .fl-out{stroke:#5b666b;stroke-width:2.5;fill:none}
.flow .fl-ret{stroke:var(--violet);stroke-width:2.5;fill:none}
.flow .fl-lab{font-size:11px;fill:#0e6a4d;letter-spacing:.06em;font-weight:800}
.flow .fl-lab-out{font-size:11px;fill:var(--muted);letter-spacing:.06em;font-weight:800}
.flow .fl-lab-ret{font-size:11px;fill:var(--violet);letter-spacing:.06em;font-weight:800}
@media (prefers-reduced-motion:no-preference){
  .flow .fl-in,.flow .fl-out,.flow .fl-ret{stroke-dasharray:9 11;animation:flowdash 1.1s linear infinite}
  @keyframes flowdash{to{stroke-dashoffset:-20}}
}
.mf-companies{display:flex;gap:6px;flex-wrap:wrap}
.mf-companies span{border-radius:999px;background:var(--primary-soft);color:var(--primary);padding:5px 9px;font-size:10px;font-weight:700}
.flow-caption{margin:14px 0 0;color:var(--muted);font-size:12px;border-top:1px dashed var(--line-soft);padding-top:12px}
.cash-cycle{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.cycle-node{position:relative;border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:9px;background:#fff;padding:13px;min-height:70px}
.cycle-node:not(:last-child)::after{content:'arrow_forward';font-family:'Material Symbols Outlined';position:absolute;right:-23px;top:26px;color:#9da7aa;font-size:18px}
.cycle-node b{display:block;font-size:12.5px}
.cycle-node small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.flow-key{display:flex;gap:8px;flex-wrap:wrap}
.flow-key span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.flow-key i{width:16px;height:0;border-top:3px solid var(--green);display:inline-block;border-radius:2px}
.flow-key .out i{border-top-color:#5b666b}
.flow-key .ret i{border-top-color:var(--violet)}

/* ---------- assets page ---------- */
.asset-parent{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 0;border:1.5px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:12px;padding:13px 34px;font:700 18px/1.1 Manrope,Inter,sans-serif;width:fit-content}
.asset-stem{width:1px;height:22px;background:var(--line);margin:0 auto}
.asset-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{border:1px solid var(--line-soft);border-top:3px solid var(--primary);border-radius:9px;background:#fff;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 22px/1.1 Manrope,Inter,sans-serif}
.stat small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:600}
.co-block{border:1px solid var(--line-soft);border-radius:12px;background:#fff;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.co-head{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.co-ic{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--primary);color:#fff}
.co-head h3{font:700 17px/1.1 Manrope,Inter,sans-serif;margin:0}
.co-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.co-head .pill{margin-left:auto}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 18px}
.pf-card{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface);transition:.15s}
.pf-card:hover{border-color:var(--primary);background:#fff;box-shadow:var(--shadow-lift)}
.pf-card .material-symbols-outlined{color:var(--primary);font-size:22px}
.pf-card b{display:block;font-size:12.5px;margin-top:8px}
.pf-card small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.pf-status{display:inline-block;margin-top:9px;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.04em;background:var(--primary-soft);color:var(--primary)}
.pf-status.sell{background:var(--green-soft);color:#0e6a4d}
.pf-status.hold{background:var(--violet-soft);color:var(--violet)}
.svc-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.svc-mini{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;text-align:center;transition:.15s}
.svc-mini:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.svc-mini b{display:block;font:700 12.5px/1.15 Manrope,Inter,sans-serif}
.svc-mini small{display:block;color:var(--muted);font-size:9.5px;margin-top:4px;line-height:1.35}
.svc-mini .material-symbols-outlined{font-size:20px;color:var(--primary)}
.svc-note{margin:14px 0 0;color:var(--muted);font-size:11px;text-align:center}

/* ---------- projects page ---------- */
.capital-wrap{overflow:auto;padding-bottom:4px}
.capital-loop{min-width:900px;display:grid;grid-template-columns:repeat(5,minmax(120px,1fr) 22px) minmax(120px,1fr);align-items:center}
.capital-node{position:relative;min-height:130px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;text-align:left;color:var(--text);transition:.18s}
.capital-node:hover,.capital-node.active{border-color:var(--primary);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.capital-node.fund:hover,.capital-node.fund.active{border-color:var(--violet)}
.phase-code{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:11px}
.capital-node.fund .phase-code{background:var(--violet-soft);color:var(--violet)}
.capital-node b{display:block;margin:11px 0 3px;color:var(--ink);font-size:13.5px}
.capital-node small{display:block;color:var(--muted);line-height:1.35;font-size:10.5px}
.owner-tag{display:block;margin-top:9px;color:var(--primary);font-size:9.5px;font-weight:800;letter-spacing:.03em}
.capital-node.fund .owner-tag{color:var(--violet)}
.stage-arrow{display:grid;place-items:center;color:#a2abad}
.stage-detail{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;margin-top:15px;padding:15px 17px;border-radius:8px;background:#f6f8f8;border-left:3px solid var(--primary)}
.stage-detail.fund{border-left-color:var(--violet);background:#faf8ff}
.stage-detail h3{margin:2px 0 4px;font:700 15px/1.2 Manrope,Inter,sans-serif}
.stage-detail p{margin:0;color:var(--text);font-size:12px}
.stage-detail ul{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;list-style:none;padding:0;margin:0}
.stage-detail li{background:#fff;border:1px solid var(--line-soft);border-radius:6px;padding:9px;color:var(--text);font-size:11px}
.stage-detail .label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);margin-bottom:4px}
.live-control{display:flex;align-items:center;gap:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,131,98,.12)}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:livePulse 1.6s infinite}@keyframes livePulse{50%{transform:scale(.72);opacity:.5}}}
.flow-player{border:1px solid var(--line);background:#fff;color:var(--primary);border-radius:7px;padding:6px 10px;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700}
.flow-player .material-symbols-outlined{font-size:16px}
.flow-now{display:flex;align-items:center;gap:10px;background:#f5f8f8;border:1px solid var(--line-soft);border-radius:8px;padding:10px 13px;margin:14px 0 12px}
.flow-now .material-symbols-outlined{color:var(--primary)}
.flow-now b{font-size:12px}
.flow-now span:last-child{color:var(--muted);font-size:11px}
.department-map{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.dept-module{border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px;min-height:186px;transition:.25s}
.dept-module.support{grid-column:span 2;background:#fffcf2;border-color:#eadca8}
.dept-module.is-live{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,67,84,.09),0 8px 22px rgba(0,67,84,.10);transform:translateY(-2px)}
.dept-head{display:flex;align-items:flex-start;gap:9px}
.dept-head>.material-symbols-outlined{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:18px}
.dept-head div{min-width:0;flex:1}
.dept-head b{display:block;font-size:12.5px}
.dept-head small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
.phase-tag{border-radius:999px;background:#eef1f2;color:var(--text);padding:3px 6px;font-size:8px;font-weight:800;letter-spacing:.06em}
.component-chips{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}
.component-chips span{border:1px solid var(--line-soft);border-radius:6px;background:#f7f9f9;padding:5px 7px;color:var(--text);font-size:9px}
.stakeholder-row{display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:9px}
.stakeholder-row span{border-radius:999px;background:var(--amber-soft);color:#6e5000;padding:4px 7px;font-size:8px}
.money-direction{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:9px;font-weight:700;color:var(--green)}
.money-direction.out{color:var(--red)}
.money-direction .material-symbols-outlined{font-size:13px}
.visual-legend{display:flex;gap:8px;flex-wrap:wrap}
.visual-key{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.visual-key i{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.visual-key.stakeholder i{background:var(--amber)}
.visual-key.cash i{background:var(--green)}
.governance-rail{display:grid;grid-template-columns:1fr 34px 1fr 34px 1fr;align-items:stretch;gap:0}
.governance-node{border:1px solid var(--line);border-radius:8px;padding:13px;background:#fff;display:flex;align-items:center;gap:10px}
.governance-node .material-symbols-outlined{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;background:var(--primary-soft);color:var(--primary)}
.governance-node b{display:block;font-size:12.5px}
.governance-node small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.gov-arrow{display:grid;place-items:center;color:#9ba5a9}

/* ---------- people page ---------- */
.people-band{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:6px}
.lead-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px 16px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow)}
.lead-card .material-symbols-outlined{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--primary);color:#fff;font-size:18px}
.lead-card b{display:block;font-size:13px}
.lead-card small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.dept-people{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.pd-card{border:1px solid var(--line);border-top:4px solid var(--primary);border-radius:10px;background:#fff;padding:13px;transition:.15s}
.pd-card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.pd-card .pd-ic{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:var(--primary-soft);color:var(--primary)}
.pd-card .pd-ic .material-symbols-outlined{font-size:17px}
.pd-card b{display:block;font-size:12.5px;margin-top:9px}
.pd-card>small{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}
.role-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.role-chips span{border-radius:999px;background:var(--primary-soft);color:var(--primary);padding:4px 8px;font-size:9px;font-weight:700}
.pd-note{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px;color:var(--muted);font-size:9px;font-weight:600}
.crm-board{display:grid;grid-template-columns:1fr 42px 1.05fr 42px 1fr;gap:10px;align-items:center}
.crm-col{display:grid;gap:10px}
.crm-card{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:9px;background:#fff;padding:11px 12px;transition:.15s}
.crm-card:hover{border-color:var(--primary);border-left-color:var(--amber);box-shadow:var(--shadow-lift)}
.crm-card .crm-top{display:flex;align-items:center;gap:8px}
.crm-card .material-symbols-outlined{font-size:18px;color:var(--amber)}
.crm-card.money-side{border-left-color:var(--violet)}
.crm-card.money-side .material-symbols-outlined{color:var(--violet)}
.crm-card b{font-size:12.5px}
.crm-card small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.4}
.crm-card .crm-co{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.crm-card .crm-co span{border-radius:999px;background:#f0f3f4;padding:3px 6px;font-size:8px;color:var(--text);font-weight:600}
.crm-arrows{display:grid;gap:26px;justify-items:center;color:#9da7aa}
.crm-hub{position:relative;border-radius:16px;background:var(--primary);color:#fff;padding:26px 20px;text-align:center;box-shadow:0 14px 34px rgba(0,67,84,.28);overflow:hidden}
.crm-hub::before{content:"";position:absolute;inset:-40% -40% auto auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.crm-hub .material-symbols-outlined{font-size:34px}
.crm-hub b{display:block;font:800 19px/1.15 Manrope,Inter,sans-serif;margin-top:10px}
.crm-hub small{display:block;color:#cfe0e4;font-size:11px;margin-top:7px;line-height:1.45}
.crm-hub .crm-feat{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.crm-hub .crm-feat span{border-radius:999px;background:rgba(255,255,255,.14);padding:4px 8px;font-size:9px;font-weight:700}
.crm-banner{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid #eadca8;border-radius:9px;padding:11px 14px;margin-bottom:16px;color:#684c00;font-size:12px;font-weight:600}
.crm-banner .material-symbols-outlined{font-size:18px}
.crm-hub-top{max-width:480px;margin:0 auto;padding:22px}
.crm-stem{width:1.5px;height:24px;background:var(--line);margin:0 auto}
.crm-fork{position:relative;max-width:840px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-top:22px}
.crm-fork::before{content:"";position:absolute;top:0;left:25%;right:25%;height:1.5px;background:var(--line)}
.fork-card{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 16px 13px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;text-align:center}
.fork-card::before{content:"";position:absolute;top:-22px;left:50%;width:1.5px;height:22px;background:var(--line)}
.fork-card>.material-symbols-outlined{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:21px;margin-bottom:3px}
.fork-card b{font:800 16px/1.1 Manrope,Inter,sans-serif}
.fork-card small{color:var(--muted);font-size:11px}
.fork-hint{margin-top:7px;font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--primary);text-transform:uppercase;opacity:0;transition:.2s}
.fork-card.active{border-color:var(--primary);box-shadow:var(--shadow-lift)}
.fork-card.dim{opacity:.55;background:#eef1f2;transform:scale(.96)}
.fork-card.dim:hover{opacity:.85}
.fork-card.dim .fork-hint{opacity:1}
.ext-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.crm-card.gov-side{border-left-color:var(--primary)}
.crm-card.gov-side .material-symbols-outlined{color:var(--primary)}
.itree{display:flex;align-items:center;margin-top:26px}
.itree-root{flex:none;border:1.5px solid var(--primary);background:var(--primary);color:#fff;border-radius:14px;padding:22px 26px;font:800 20px/1.1 Manrope,Inter,sans-serif;box-shadow:var(--shadow-lift)}
.itree-link{flex:none;width:26px;height:1.5px;background:var(--line)}
.itree-branches{flex:1;position:relative;padding-left:26px;display:grid;gap:8px}
.itree-branches::before{content:"";position:absolute;left:0;top:30px;bottom:30px;width:1.5px;background:var(--line)}
.itree-row{position:relative;display:grid;grid-template-columns:265px 1fr;gap:14px;align-items:center}
.itree-row::before{content:"";position:absolute;left:-26px;top:50%;width:26px;height:1.5px;background:var(--line)}
.itree-dept{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;display:flex;gap:9px;align-items:center;box-shadow:var(--shadow)}
.itree-dept .ti{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--primary-soft);color:var(--primary);flex:none}
.itree-dept .ti .material-symbols-outlined{font-size:16px}
.itree-dept b{display:block;font-size:12.5px}
.itree-dept small{display:block;color:var(--muted);font-size:9.5px;margin-top:1px}
.itree-roles{display:flex;flex-wrap:wrap;gap:6px}
.itree-roles span{border-radius:999px;background:var(--primary-soft);color:var(--primary);padding:5px 10px;font-size:10.5px;font-weight:700}
.itree-row.lead .itree-dept{border-color:#e2ca8c;background:var(--amber-soft)}
.itree-row.lead .itree-dept .ti{background:#fff;color:var(--amber)}

.int-ext{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ie-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.ie-card .material-symbols-outlined{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;flex:none}
.ie-card.int .material-symbols-outlined{background:var(--primary-soft);color:var(--primary)}
.ie-card.ext .material-symbols-outlined{background:var(--amber-soft);color:var(--amber)}

.ie-card p{margin:4px 0 0;color:var(--text);font-size:11.5px}

/* ---------- responsive ---------- */
@media(max-width:1080px){
  .angles{grid-template-columns:1fr 1fr}
  .org-svc{grid-template-columns:repeat(2,1fr)}
  .org-svc::before{left:25%;right:25%}
  .ext-grid{grid-template-columns:1fr 1fr}
  .itree-row{grid-template-columns:220px 1fr}
  .pf-grid{grid-template-columns:repeat(2,1fr)}
  .svc-strip{grid-template-columns:repeat(4,1fr)}

  .dept-people{grid-template-columns:1fr 1fr}
  .asset-stats{grid-template-columns:1fr 1fr}
  .cash-cycle{grid-template-columns:1fr;gap:10px}
  .cycle-node:not(:last-child)::after{content:'arrow_downward';right:calc(50% - 9px);top:auto;bottom:-20px}
}
@media(max-width:720px){
  .nav{overflow-x:auto;flex:1;margin-left:6px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:7px 10px;font-size:12px;white-space:nowrap}
  .nav a .material-symbols-outlined{display:none}
  .topbar{gap:10px}
  .angles{grid-template-columns:1fr}
  .org-heavy{grid-template-columns:1fr}
  .org-heavy::before{display:none}
  .org-svc{grid-template-columns:1fr 1fr}
  .org-svc::before{display:none}
  .org-card::before{display:none}
  .org-detail{grid-template-columns:1fr}
  .crm-board{grid-template-columns:1fr}
  .crm-arrows{display:none}
  .stage-detail{grid-template-columns:1fr}
  .stage-detail ul{grid-template-columns:1fr}
  .governance-rail{grid-template-columns:1fr}
  .gov-arrow{transform:rotate(90deg);min-height:28px}
  .people-band{grid-template-columns:1fr}
  .int-ext{grid-template-columns:1fr}
  .dept-module.support{grid-column:auto}
  .org-sub{grid-template-columns:1fr}
  .org-subwrap{grid-template-columns:1fr}
  .org-subwrap::before,.org-card.sub::before,.org-card.has-sub::after{display:none}
  .ext-grid{grid-template-columns:1fr}
  .crm-fork{grid-template-columns:1fr}
  .crm-fork::before,.fork-card::before{display:none}
  .itree{flex-direction:column;align-items:stretch;gap:10px}
  .itree-link{display:none}

  .itree-branches::before{display:none}
  .itree-row{grid-template-columns:1fr}
  .itree-row::before{display:none}
}

  return `<svg class="umbrella-svg" viewBox="0 0 1200 330" role="img" aria-label="AlphaX Re Capital canopy over ten companies">
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0e6a84" stop-opacity=".12"/>
        <stop offset=".5" stop-color="#22d3ee"/>
        <stop offset="1" stop-color="#0e6a84" stop-opacity=".12"/>

      <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">

      </linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">

        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

function wireAssets(){
  const svg=document.getElementById('assetWires');
  if(!svg) return;
  const map=svg.parentElement;
  function draw(){
    const g=map.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${g.width} ${g.height}`);
    if(window.innerWidth<960){svg.innerHTML='';return;}
    const node=map.querySelector('.fx-node-main');
    if(!node) return;
    const n=node.getBoundingClientRect();
    const nl=n.left-g.left-8, nr=n.right-g.left+8, nyc=n.top-g.top+n.height/2;
    let paths='';
    const curve=(x1,y1,x2,y2)=>{
      const dx=Math.abs(x2-x1)*.55;
      return `M ${x1} ${y1} C ${x1+(x2>x1?dx:-dx)} ${y1}, ${x2+(x2>x1?-dx:dx)} ${y2}, ${x2} ${y2}`;
    };
    const lefts=[...map.querySelectorAll('.fx-col.left .fx-box')];
    lefts.forEach((b,i)=>{
      const r=b.getBoundingClientRect();
      const ey=nyc+(i-(lefts.length-1)/2)*20;
      paths+=`<path class="wire" d="${curve(r.right-g.left,r.top-g.top+r.height/2,nl,ey)}"/>`;
    });
    const rights=[...map.querySelectorAll('.fx-col.right .fx-box')];
    rights.forEach((b,i)=>{
      const r=b.getBoundingClientRect();
      const ey=nyc+(i-(rights.length-1)/2)*20;
      paths+=`<path class="wire" d="${curve(r.left-g.left,r.top-g.top+r.height/2,nr,ey)}"/>`;
    });
    svg.innerHTML=`<defs><marker id="wireArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#4998ab"/></marker></defs>${paths}`;
    svg.querySelectorAll('.wire').forEach(p=>p.setAttribute('marker-end','url(#wireArrow)'));
  }
  draw();
  setTimeout(draw,300);
  if(window.__awr) window.removeEventListener('resize',window.__awr);
  window.__awr=draw;
  window.addEventListener('resize',draw);
}

    window.__pmlayer=k;

    const sa=document.querySelector('.pyr-sa2');if(sa)sa.classList.toggle('sel',k===5);

  }
  document.querySelectorAll('.pyr2-hit,.pyr-sa2,.lgroup').forEach(el=>{
    const k=+el.dataset.layer;
    if(!k)return;
    el.addEventListener('mouseenter',()=>selectLayer(k));
    el.addEventListener('click',e=>{if(!e.target.closest('[data-guide]'))selectLayer(k);});
  });
  selectLayer(window.__pmlayer||1);
  const nodes=[...document.querySelectorAll('.capital-node')];
  const detail=document.getElementById('stageDetail');
  nodes.forEach(n=>n.addEventListener('click',()=>{
    const s=STAGES.find(x=>x.key===n.dataset.stage);

    nodes.forEach(x=>x.classList.toggle('active',x===n&&active));
    detail.innerHTML=active?`<div class="stage-detail ${s.fund?'fund':''}">
      <div><div class="label">${s.code} · ${s.owner}</div><h3>${s.title}</h3><p>${s.focus}</p></div>
    </div>`:'';
  }));
  const msg=document.getElementById('orbMsg');
  document.querySelectorAll('.orb').forEach(o=>{
    const i=+o.dataset.i, sp=document.querySelector('.orbit-spokes .sp-'+i);
    o.addEventListener('mouseenter',()=>{
      if(msg)msg.innerHTML=`<b style="color:#fff">${ORBIT[i].t}</b><br>${ORBIT[i].g}`;

    });
    o.addEventListener('mouseleave',()=>{
      if(msg)msg.textContent=ORB_DEFAULT;
      if(sp)sp.classList.remove('lit');
    });
  });
}

/* align the Seller-Replied fork: spine spans both branch labels, arrow meets its midpoint */
function swsWire(){
  const wrap=document.querySelector('.sws-forkwrap');
  if(!wrap)return;
  const spine=wrap.querySelector('.sws-spine');
  const labs=[...wrap.querySelectorAll('.sws-outrow > .sws-lab')];
  const ar=document.querySelector('.sws-ar.fork');
  if(!spine||labs.length<2)return;
  if(window.matchMedia('(max-width:1020px)').matches){
    spine.style.display='none';
    if(ar){ar.style.alignSelf='';ar.style.marginTop='';}
    return;
  }
  spine.style.display='';
  const wr=wrap.getBoundingClientRect();
  const mid=l=>{const r=l.getBoundingClientRect();return r.top+r.height/2-wr.top;};
  const top=mid(labs[0]), h=mid(labs[labs.length-1])-top;
  spine.style.top=top+'px'; spine.style.height=h+'px';
  if(ar){
    ar.style.alignSelf='start'; ar.style.marginTop='0px';
    ar.style.marginTop=(wr.top+top+h/2-ar.getBoundingClientRect().top)+'px';
  }
}
window.addEventListener('resize',()=>{clearTimeout(window.__swsT);window.__swsT=setTimeout(swsWire,120);});

const tkEsc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tkDefault(){const o={};TK_TEAMS.forEach(g=>g.svcs.forEach(s=>o[s.id]=s.t.slice()));return o;}
function tkLoad(){
  try{const raw=localStorage.getItem(TK_KEY);
    if(raw){const o=JSON.parse(raw),d=tkDefault();
      for(const k in d)if(!Array.isArray(o[k]))o[k]=d[k];
      return o;}
  }catch(e){}
  return tkDefault();
}
function tkSave(o){try{localStorage.setItem(TK_KEY,JSON.stringify(o));}catch(e){}}
let TK_STATE=null;
function tkRow(id,t,i){
  return `<li class="tk-row"><span class="tk-i">${i+1}</span><span class="tk-t">${tkEsc(t)}</span>
    <span class="tk-btns">
      <button data-mv="${id}|${i}|-1" title="Move up">${icon('keyboard_arrow_up')}</button>
      <button data-mv="${id}|${i}|1" title="Move down">${icon('keyboard_arrow_down')}</button>
      <button class="del" data-del="${id}|${i}" title="Delete">${icon('close')}</button>
    </span></li>`;
}
function tkHTML(){
  TK_STATE=tkLoad();
  return `
  <div class="section rise"><div class="section-head"><h2>Micro-services &amp; build to-dos</h2><span class="pill">EDITABLE · ▲▼ REORDER · ADD &amp; DELETE · SAVED IN THIS BROWSER</span><p>Every agent and service from the Old-vs-New boards, broken into build tasks. Your edits persist locally on this machine.</p></div>
  <div class="section-body"><div id="tkRoot">
    <div class="tk-bar"><button class="tk-reset" id="tkReset">Reset to default</button></div>
    ${TK_TEAMS.map(g=>`<div class="tk-team">
      <div class="tk-team-t">${icon(g.ic)}${g.team}</div>
      <div class="tk-grid">
        ${g.svcs.map(s=>`<div class="tk-card" data-svc="${s.id}">
          <div class="tk-h"><b>${s.n}</b><small>${s.d}</small></div>
          <ol class="tk-list">${(TK_STATE[s.id]||[]).map((t,i)=>tkRow(s.id,t,i)).join('')}</ol>
          <div class="tk-add"><input type="text" placeholder="Add a task…" data-add="${s.id}"><button data-addbtn="${s.id}" title="Add">${icon('add')}</button></div>
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div></div></div>`;
}
function tkRefresh(id){
  const card=document.querySelector(`.tk-card[data-svc="${id}"]`);
  if(card)card.querySelector('.tk-list').innerHTML=(TK_STATE[id]||[]).map((t,i)=>tkRow(id,t,i)).join('');
}
function tkAdd(id){
  const inp=document.querySelector(`[data-add="${id}"]`);
  const v=(inp&&inp.value||'').trim();
  if(!v)return;
  (TK_STATE[id]=TK_STATE[id]||[]).push(v);
  inp.value='';
  tkSave(TK_STATE);
  tkRefresh(id);
}
function wireTasks(){
  const root=document.getElementById('tkRoot');
  if(!root)return;
  root.addEventListener('click',e=>{
    if(e.target.id==='tkReset'){
      if(confirm('Reset every list back to the default tasks?')){TK_STATE=tkDefault();tkSave(TK_STATE);render();}
      return;
    }
    const mv=e.target.closest('[data-mv]');
    if(mv){const[id,i,d]=mv.dataset.mv.split('|');const a=TK_STATE[id]||[];const from=+i,to=from+ +d;
      if(to<0||to>=a.length)return;
      [a[from],a[to]]=[a[to],a[from]];tkSave(TK_STATE);tkRefresh(id);return;}
    const del=e.target.closest('[data-del]');
    if(del){const[id,i]=del.dataset.del.split('|');(TK_STATE[id]||[]).splice(+i,1);tkSave(TK_STATE);tkRefresh(id);return;}
    const add=e.target.closest('[data-addbtn]');
    if(add){tkAdd(add.dataset.addbtn);return;}
  });
  root.addEventListener('keydown',e=>{
    const inp=e.target.closest&&e.target.closest('[data-add]');
    if(inp&&e.key==='Enter')tkAdd(inp.dataset.add);
  });
}

  return `
  <div class="section rise"><div class="section-head"><h2>1 · Build, sell, recycle</h2><span class="pill">CLICK A TEAM · OLD VS NEW</span></div>

function aiView(){
  const mode=window.__aimode||'teams';
  return `
  ${pageHead('AlphaX · agent-first','AI Native Builder Company','Same business, rebuilt agent-first. AI agents do the work — people review, decide, negotiate, and keep the relationships.')}
  <div class="co-tabs rise">
    <button class="co-tab ${mode==='teams'?'active':''}" data-aimode="teams">Old vs New</button>

  </div>
  ${mode==='teams'?aiTeamsHTML():tkHTML()}`;
}
function wireAI(){
  document.querySelectorAll('[data-aimode]').forEach(b=>b.onclick=()=>{window.__aimode=b.dataset.aimode;render();});
  if((window.__aimode||'teams')==='tasks'){wireTasks();return;}
  const panel=document.getElementById('aiTeamPanel');
  const hubT=document.getElementById('aiHubT'), hubG=document.getElementById('aiHubG');
  function sel(i){
    window.__aiteam=i;
    document.querySelectorAll('.ai-orb').forEach((b,k)=>b.classList.toggle('active',k===i));
    document.querySelectorAll('.ai-tab').forEach((b,k)=>b.classList.toggle('active',k===i));
    document.querySelectorAll('.ai-orbit .orbit-spokes line').forEach((l,k)=>l.classList.toggle('lit',k===i));
    if(hubT)hubT.textContent=ORBIT[i].t;
    if(hubG)hubG.textContent=ORBIT[i].g;
    panel.innerHTML=aiTeamPanelHTML(i);
    swsWire();
  }
  document.querySelectorAll('.ai-orb,.ai-tab').forEach(b=>b.onclick=()=>sel(+b.dataset.i));
  sel(window.__aiteam||0);
}

/* =============== router =============== */
const content=document.getElementById('content');
const ROUTES={
  home:{render:homeView, wire:null},
  money:{render:moneyView, wire:null},
  assets:{render:assetsView, wire:wireAssets},
  projects:{render:projectsView, wire:wireProjects},
  people:{render:peopleView, wire:wirePeople},
  ai:{render:aiView, wire:wireAI}
};
function currentRoute(){
  const h=location.hash.replace(/^#\/?/,'').split('#')[0];
  return ROUTES[h]?h:'home';
}
function render(){
  if(flowTimer){clearInterval(flowTimer);flowTimer=null;}
  const h=location.hash.replace(/^#\//,'').split('#')[0];
  if(h.startsWith('pm/')){
    content.innerHTML=pmPageView(decodeURIComponent(h.slice(3)));
    wirePmPage();
    document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav==='projects'));
    window.scrollTo(0,0);
    return;
  }
  const key=currentRoute();
  content.innerHTML=ROUTES[key].render();
  if(ROUTES[key].wire)ROUTES[key].wire();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));
  if(!location.hash.includes('#mf-'))window.scrollTo(0,0);
}
/* reveal icon glyphs only once the icon font is confirmed loaded (avoids raw ligature text).
   Measurement-based: with the ligature font active, the word "home" collapses to one glyph. */
(function(){
  const ctx=document.createElement('canvas').getContext('2d');
  function loaded(){
    ctx.font='20px "Material Symbols Outlined", monospace';
    const w1=ctx.measureText('home').width;
    ctx.font='20px monospace';
    return Math.abs(w1-ctx.measureText('home').width)>2;
  }
  function reveal(){if(loaded())document.body.classList.add('icons-ready');}
  if(document.fonts){
    document.fonts.load('20px "Material Symbols Outlined"').then(reveal).catch(()=>{});
    document.fonts.ready.then(reveal);
  }
  [400,1200,3000,6000].forEach(t=>setTimeout(reveal,t));
})();
window.addEventListener('hashchange',()=>{
  const h=location.hash;
  if(h&&!h.startsWith('#/')){
    const el=document.getElementById(h.slice(1));
    if(el){el.scrollIntoView({behavior:'smooth'});return;}
  }
  render();
});
render();
